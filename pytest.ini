# =====================================================================
# FORGE-AI :: pytest configuration
# =====================================================================
[pytest]
testpaths = tests/unit tests/integration
python_files = test_*.py
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    integration: needs a live control plane or provisioned targets
    slow: takes more than a few seconds
filterwarnings =
    error::DeprecationWarning:forge_config
    ignore::DeprecationWarning
