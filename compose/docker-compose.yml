# =====================================================================
# FORGE-AI :: GitOps control plane
# =====================================================================
#   Gitea      -- internal GitOps repository consumed by Semaphore
#   Semaphore  -- Ansible workflow engine and audit trail
#   PostgreSQL -- shared, but with a separate database per application
#   proxy      -- TLS termination for Gitea and Semaphore
#   bootsrv    -- boot artefacts on the isolated provisioning network
#   state      -- iPXE dispatch, lifecycle state, reinstall-loop guard
#   webhook    -- HMAC-validated Gitea -> Semaphore trigger
#   winmedia   -- read-only SMB export of operator-supplied Windows media
#
# Bring it up with the Makefile, never with a bare `docker compose up`:
#   make deploy-control-plane
# The Makefile checks that compose/.env exists, that the provisioning
# bridge is present (bootsrv binds to it), and that no placeholder
# secret survived from .env.example.
#
# Image tags are pinned. Digest pinning is the production
# recommendation and is described in docs/SECURITY.md.
# =====================================================================
---
name: forge-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

services:

  # -------------------------------------------------------------------
  # PostgreSQL -- one server, one role and database per application.
  # -------------------------------------------------------------------
  database:
    image: postgres:16.4-alpine3.20
    container_name: forge-database
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER is required - copy compose/.env.example to compose/.env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required - run bootstrap/create-secrets.sh}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
      GITEA_DB_NAME: ${GITEA_DB_NAME:-gitea}
      GITEA_DB_USER: ${GITEA_DB_USER:-gitea}
      GITEA_DB_PASSWORD: ${GITEA_DB_PASSWORD:?GITEA_DB_PASSWORD is required}
      SEMAPHORE_DB_NAME: ${SEMAPHORE_DB_NAME:-semaphore}
      SEMAPHORE_DB_USER: ${SEMAPHORE_DB_USER:-semaphore}
      SEMAPHORE_DB_PASSWORD: ${SEMAPHORE_DB_PASSWORD:?SEMAPHORE_DB_PASSWORD is required}
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      backend:
        aliases: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

  # -------------------------------------------------------------------
  # Gitea -- the internal GitOps repository. Semaphore clones from here,
  # never from GitHub directly.
  # -------------------------------------------------------------------
  gitea:
    image: gitea/gitea:1.22.6-rootless
    container_name: forge-gitea
    <<: *default-restart
    logging: *default-logging
    depends_on:
      database: {condition: service_healthy}
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: database:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:?GITEA_DB_PASSWORD is required}
      GITEA__database__SSL_MODE: disable
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-gitea.poc.local}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-https://gitea.poc.local:8443/}
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN:-gitea.poc.local}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY:?GITEA_SECRET_KEY is required - run bootstrap/create-secrets.sh}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN:?GITEA_INTERNAL_TOKEN is required}
      # A GitOps repository has no reason to accept anonymous readers or
      # self-service registration.
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__ENABLE_BASIC_AUTHENTICATION: "true"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__repository__DEFAULT_BRANCH: ${GITOPS_DEFAULT_BRANCH:-main}
      GITEA__mirror__ENABLED: "true"
      GITEA__mirror__DEFAULT_INTERVAL: ${GITEA_MIRROR_INTERVAL:-10m}
      GITEA__mirror__MIN_INTERVAL: 5m
      GITEA__cron_2E_update_mirrors__SCHEDULE: "@every ${GITEA_MIRROR_INTERVAL:-10m}"
      GITEA__log__LEVEL: ${GITEA_LOG_LEVEL:-Info}
      GITEA__actions__ENABLED: "false"
      USER_UID: "1000"
      USER_GID: "1000"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # SSH for git push/pull. Browser/LAN HTTP is reached through the
      # proxy only -- this second line is loopback-only, for this
      # stack's own Ansible automation (gitea_config role, which talks
      # to gitea_api_url straight over HTTP instead of the TLS proxy).
      # It does not change what is reachable from the LAN.
      - "${BIND_ADDRESS:-127.0.0.1}:${GITEA_SSH_PORT:-2222}:2222"
      - "127.0.0.1:${GITEA_HTTP_PORT:-3000}:3000"
    networks:
      backend: {aliases: [gitea]}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}

  # -------------------------------------------------------------------
  # Semaphore -- runs the Ansible workflows and keeps the audit trail.
  # -------------------------------------------------------------------
  semaphore:
    image: semaphoreui/semaphore:v2.10.34
    container_name: forge-semaphore
    <<: *default-restart
    logging: *default-logging
    depends_on:
      database: {condition: service_healthy}
      gitea: {condition: service_healthy}
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: database
      SEMAPHORE_DB_PORT: "5432"
      SEMAPHORE_DB: ${SEMAPHORE_DB_NAME:-semaphore}
      SEMAPHORE_DB_USER: ${SEMAPHORE_DB_USER:-semaphore}
      SEMAPHORE_DB_PASS: ${SEMAPHORE_DB_PASSWORD:?SEMAPHORE_DB_PASSWORD is required}
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN_USER:-forgeadmin}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-FORGE-AI Administrator}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@poc.local}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:?SEMAPHORE_ADMIN_PASSWORD is required - run bootstrap/create-secrets.sh}
      # 32 raw bytes, base64-encoded. Semaphore uses it to encrypt the
      # Key Store at rest; losing it means losing every stored key.
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:?SEMAPHORE_ACCESS_KEY_ENCRYPTION is required}
      SEMAPHORE_WEB_ROOT: ${SEMAPHORE_WEB_ROOT:-}
      SEMAPHORE_LDAP_ACTIVATED: "no"
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_FORCE_COLOR: "1"
    volumes:
      - semaphore-data:/var/lib/semaphore
      - semaphore-config:/etc/semaphore
      - semaphore-tmp:/tmp/semaphore
      # Read-only view of the boot artefacts so a playbook run can read
      # checksums and state without a writable mount.
      - ${FORGE_ARTIFACTS_DIR:-/srv/forge-ai}/state:/srv/forge-ai/state:ro
      - ${FORGE_ARTIFACTS_DIR:-/srv/forge-ai}/reports:/srv/forge-ai/reports:rw
    ports:
      # Loopback-only, for this stack's own Ansible automation
      # (semaphore_config role, semaphore_api_url) -- browser/LAN access
      # still goes only through the TLS proxy.
      - "127.0.0.1:${SEMAPHORE_HTTP_PORT:-3001}:3000"
    networks:
      backend: {aliases: [semaphore]}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/ping || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 4G}

  # -------------------------------------------------------------------
  # Reverse proxy -- TLS termination for Gitea and Semaphore.
  # -------------------------------------------------------------------
  proxy:
    image: nginx:1.27.2-alpine3.20
    container_name: forge-proxy
    <<: *default-restart
    logging: *default-logging
    depends_on:
      gitea: {condition: service_healthy}
      semaphore: {condition: service_healthy}
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
      - proxy-cache:/var/cache/nginx
      - proxy-run:/var/run
    ports:
      # Deliberately its own variable, not BIND_ADDRESS: that one also
      # gates Gitea's git-over-SSH port (2222) above, which has no
      # reason to follow the web UIs onto the LAN. Defaults to loopback
      # like everything else; set PROXY_BIND_ADDRESS to the host's LAN
      # IP (or 0.0.0.0) to reach Gitea/Semaphore without an SSH tunnel.
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${PROXY_HTTP_PORT:-8081}:8081"
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${PROXY_HTTPS_PORT:-8443}:8443"
    networks:
      backend: {aliases: [proxy]}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M}

  # -------------------------------------------------------------------
  # Boot artefact server -- bound to the libvirt provisioning bridge.
  # This is the ONLY service published on the provisioning network.
  # -------------------------------------------------------------------
  bootsrv:
    image: nginx:1.27.2-alpine3.20
    container_name: forge-bootsrv
    <<: *default-restart
    logging: *default-logging
    depends_on:
      state: {condition: service_healthy}
    volumes:
      - ${FORGE_ARTIFACTS_DIR:-/srv/forge-ai}/http:/srv/http:ro
      - ${FORGE_ARTIFACTS_DIR:-/srv/forge-ai}/config/boot-server.conf:/etc/nginx/conf.d/default.conf:ro
      - bootsrv-cache:/var/cache/nginx
      - bootsrv-run:/var/run
      - ${FORGE_ARTIFACTS_DIR:-/srv/forge-ai}/logs/nginx:/var/log/nginx:rw
    ports:
      # PROVISIONING_BIND_ADDRESS is the libvirt bridge address. The
      # bridge must exist first, which is why `make bootstrap` creates
      # the network before starting this stack.
      - "${PROVISIONING_BIND_ADDRESS:-192.168.250.1}:${BOOT_HTTP_PORT:-8080}:8080"
    networks:
      backend: {aliases: [bootsrv]}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 512M}

  # -------------------------------------------------------------------
  # Provisioning state service -- see compose/state-service/app.py.
  # -------------------------------------------------------------------
  state:
    build:
      context: ./state-service
      dockerfile: Dockerfile
    image: forge-ai/state:${FORGE_VERSION:-1.0.0}
    container_name: forge-state
    <<: *default-restart
    logging: *default-logging
    environment:
      FORGE_STATE_DIR: /srv/state
      FORGE_LOG_DIR: /srv/logs
      FORGE_REGISTRY: /srv/state/registry.json
      FORGE_LISTEN_PORT: "8090"
      FORGE_BOOT_BASE_URL: ${FORGE_BOOT_BASE_URL:-http://192.168.250.1:8080}
      FORGE_MAX_INSTALL_ATTEMPTS: ${FORGE_MAX_INSTALL_ATTEMPTS:-3}
      FORGE_STATE_TOKEN: ${FORGE_STATE_TOKEN:-}
      FORGE_LOG_LEVEL: ${FORGE_LOG_LEVEL:-INFO}
    volumes:
      - ${FORGE_ARTIFACTS_DIR:-/srv/forge-ai}/state:/srv/state:rw
      - ${FORGE_ARTIFACTS_DIR:-/srv/forge-ai}/logs:/srv/logs:rw
    networks:
      backend: {aliases: [forge-state]}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M}

  # -------------------------------------------------------------------
  # Webhook receiver -- see compose/webhook/app.py.
  # -------------------------------------------------------------------
  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    image: forge-ai/webhook:${FORGE_VERSION:-1.0.0}
    container_name: forge-webhook
    <<: *default-restart
    logging: *default-logging
    depends_on:
      semaphore: {condition: service_healthy}
    environment:
      FORGE_WEBHOOK_SECRET: ${FORGE_WEBHOOK_SECRET:?FORGE_WEBHOOK_SECRET is required - run bootstrap/create-secrets.sh}
      FORGE_ALLOWED_BRANCH: ${GITOPS_DEFAULT_BRANCH:-main}
      FORGE_TEMPLATE_ROUTES: ${FORGE_TEMPLATE_ROUTES:-}
      FORGE_WEBHOOK_DRY_RUN: ${FORGE_WEBHOOK_DRY_RUN:-false}
      SEMAPHORE_URL: http://semaphore:3000
      SEMAPHORE_API_TOKEN: ${SEMAPHORE_API_TOKEN:-}
      SEMAPHORE_PROJECT_ID: ${SEMAPHORE_PROJECT_ID:-}
      FORGE_LOG_LEVEL: ${FORGE_LOG_LEVEL:-INFO}
    networks:
      backend: {aliases: [webhook]}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}

  # -------------------------------------------------------------------
  # Windows media SMB export. Only started when the operator supplied a
  # Windows ISO: `docker compose --profile windows up -d`.
  # -------------------------------------------------------------------
  winmedia:
    build:
      context: ./samba
      dockerfile: Dockerfile
    image: forge-ai/winmedia:${FORGE_VERSION:-1.0.0}
    container_name: forge-winmedia
    profiles: [windows]
    <<: *default-restart
    logging: *default-logging
    volumes:
      - ${FORGE_ARTIFACTS_DIR:-/srv/forge-ai}/http/windows/media:/srv/winmedia:ro
      - ${FORGE_ARTIFACTS_DIR:-/srv/forge-ai}/http/windows/virtio:/srv/virtio:ro
      - winmedia-state:/var/lib/samba
      - winmedia-run:/run/samba
    ports:
      - "${PROVISIONING_BIND_ADDRESS:-192.168.250.1}:445:445"
    networks:
      backend: {aliases: [winmedia]}
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 512M}

networks:
  backend:
    name: forge-backend
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_BACKEND_SUBNET:-172.28.240.0/24}

volumes:
  database-data: {name: forge-database-data}
  gitea-data: {name: forge-gitea-data}
  gitea-config: {name: forge-gitea-config}
  semaphore-data: {name: forge-semaphore-data}
  semaphore-config: {name: forge-semaphore-config}
  semaphore-tmp: {name: forge-semaphore-tmp}
  proxy-cache: {name: forge-proxy-cache}
  proxy-run: {name: forge-proxy-run}
  bootsrv-cache: {name: forge-bootsrv-cache}
  bootsrv-run: {name: forge-bootsrv-run}
  winmedia-state: {name: forge-winmedia-state}
  winmedia-run: {name: forge-winmedia-run}
