# =====================================================================
# FORGE-AI :: control-plane reverse proxy
# =====================================================================
# TLS termination for Gitea and Semaphore. The certificate is generated
# by bootstrap/create-secrets.sh as a self-signed pair; replacing it
# with one issued by a CA the operator trusts is a drop-in swap of the
# two files in compose/nginx/tls/. See docs/SECURITY.md.
#
# Host names are distinguished by SNI/Host header, so both applications
# share one HTTPS port.

# Docker's embedded DNS. Declaring it is what makes the variable-based
# proxy_pass below legal, and it is why they are written that way.
#
# nginx resolves a hostname written literally in proxy_pass exactly once,
# at configuration load, and caches the address for the life of the
# worker. Compose assigns container addresses from a pool, so recreating
# any service can hand a different address to a container -- and the
# proxy keeps talking to whoever holds the old one.
#
# That is not theoretical: on 2026-09-02 forge-gitea and forge-webhook
# were recreated 47 hours after forge-proxy and swapped places in the
# pool. The proxy went on sending Gitea's traffic to 172.28.240.6:3000,
# which by then was the webhook container listening on 8000, and the
# whole control plane answered 502 Bad Gateway while every container was
# healthy. See docs/logbook/08-ripresa-test-e-verifica-deploy.md.
#
# A hostname held in a variable is resolved per request instead, through
# this resolver, with the result cached for `valid`. The proxy then
# follows a recreated container on its own.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Gitea's git-over-http and Semaphore's task log stream both dislike
# response buffering.
proxy_buffering off;
proxy_request_buffering off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8081 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","component":"forge-proxy"}';
    }

    # Everything else is redirected to HTTPS. The PoC terminates TLS
    # with a self-signed certificate; the redirect keeps a mistyped
    # http:// URL from silently sending a Gitea token in the clear.
    location / {
        return 308 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name gitea.poc.local;

    ssl_certificate     /etc/nginx/tls/forge-ai.crt;
    ssl_certificate_key /etc/nginx/tls/forge-ai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:forge_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # git push of a large repository must not be truncated.
    client_max_body_size 512m;

    location / {
        # Held in a variable on purpose: see the resolver note at the
        # top of this file. With no URI component in the variable, nginx
        # forwards the request URI unchanged, exactly as the literal
        # form did.
        set $forge_gitea http://gitea:3000;
        proxy_pass $forge_gitea;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name semaphore.poc.local;

    ssl_certificate     /etc/nginx/tls/forge-ai.crt;
    ssl_certificate_key /etc/nginx/tls/forge-ai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:forge_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 64m;

    location / {
        set $forge_semaphore http://semaphore:3000;
        proxy_pass $forge_semaphore;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        # Semaphore streams live task output over a websocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# The Gitea webhook is delivered inside the Docker network
# (http://webhook:8000/webhook), so it needs no public listener. This
# block exists for the alternative topology where Gitea runs outside
# this stack; enable it by pointing the webhook URL at
# https://<host>:8443/webhook with the Host header below.
server {
    listen 8443 ssl;
    http2 on;
    server_name webhook.poc.local;

    ssl_certificate     /etc/nginx/tls/forge-ai.crt;
    ssl_certificate_key /etc/nginx/tls/forge-ai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /webhook {
        # $request_uri rather than a literal /webhook path: once
        # proxy_pass contains a variable, nginx stops substituting the
        # matched location prefix and would send a bare "/webhook" for
        # every request under it. Appending the original URI reproduces
        # the identity mapping the literal form had, query string
        # included.
        set $forge_webhook http://webhook:8000;
        proxy_pass $forge_webhook$request_uri;
        proxy_set_header Host $host;
        # The HMAC is computed over the raw body: it must arrive byte
        # for byte, so no rewriting or buffering here.
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
    }

    location / { return 404; }
}
