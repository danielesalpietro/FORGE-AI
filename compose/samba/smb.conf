# =====================================================================
# FORGE-AI :: read-only Windows installation media export
# =====================================================================
# Consumed by WinPE (`net use I: \\192.168.250.1\winmedia`) during the
# Windows Server installation. Everything here is deliberately minimal:
# anonymous, read-only, SMB2+ only, no printing, no browsing.
#
# SMB1 is disabled. WinPE from Windows Server 2019 onwards speaks SMB2,
# and re-enabling SMB1 to support an older WinPE would contradict the
# Windows baseline this PoC applies to its own targets.

[global]
   workgroup = FORGEAI
   server string = FORGE-AI provisioning media
   netbios name = FORGEBOOT

   # Anonymous read-only access. No credential is stored or required.
   security = user
   map to guest = Bad User
   guest account = nobody
   restrict anonymous = 0

   # Protocol floor: SMB2 minimum, SMB3 preferred.
   server min protocol = SMB2_10
   client min protocol = SMB2_10
   server max protocol = SMB3

   # Signing is available but not mandatory: WinPE's redirector is
   # inconsistent about it across builds, and the share carries no
   # secret. See docs/SECURITY.md.
   server signing = auto

   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   show add printer wizard = no

   log level = 1
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

   # Nothing on this server should ever be writable over the network.
   read only = yes

[winmedia]
   comment = Extracted Windows Server installation media (read-only)
   path = /srv/winmedia
   browseable = yes
   guest ok = yes
   read only = yes
   writable = no
   force user = nobody
   veto files = /.*/
   hide dot files = yes

[virtio]
   comment = VirtIO drivers and guest agent (read-only)
   path = /srv/virtio
   browseable = yes
   guest ok = yes
   read only = yes
   writable = no
   force user = nobody
