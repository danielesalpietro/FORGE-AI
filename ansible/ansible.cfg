# =====================================================================
# FORGE-AI :: Ansible configuration
# =====================================================================
# Ansible reads the ansible.cfg in the current working directory, so
# every documented command runs from the `ansible/` directory (the
# Makefile does this for you).
# =====================================================================

[defaults]
inventory              = inventories/poc
roles_path             = roles
collections_path       = collections:~/.ansible/collections:/usr/share/ansible/collections
filter_plugins         = filter_plugins
library                = library
host_key_checking      = False
retry_files_enabled    = False
stdout_callback        = yaml
# Keep the human-readable callback for ad-hoc runs too, and always emit
# a timing profile: the deployment report quotes per-task durations.
bin_ansible_callbacks  = True
callbacks_enabled      = profile_tasks, timer, ansible.posix.json
interpreter_python     = auto_silent
forks                  = 10
timeout                = 60
deprecation_warnings   = True
localhost_warning      = False

# An undefined variable is a bug, never an empty string -- the Ansible
# equivalent of Jinja2 StrictUndefined, and what makes the "fail on
# undefined required variables" requirement real.
#
# There is deliberately no `error_on_undefined_vars = True` line here.
# Erroring on an undefined variable has been the default since Ansible
# 2.x, and ansible-core 2.19 deprecated the option outright
# (DEFAULT_UNDEFINED_VAR_BEHAVIOR "is no longer used in the code base",
# removal scheduled for 2.23). Setting it now buys nothing and emits a
# deprecation warning on every single run.
#
# Templates that must not silently render an empty string therefore rely
# on the default behaviour plus explicit `| mandatory` or an up-front
# assert in the role -- see roles/ubuntu_autoinstall/tasks/main.yml.

# Fact caching keeps the drift and reporting playbooks fast without
# forcing a gather on every play.
gathering              = smart
fact_caching           = jsonfile
fact_caching_connection = /tmp/forge-ai-facts
fact_caching_timeout   = 3600

# Secrets are kept out of task output with `no_log: true` on the
# individual tasks that touch them (see roles/windows_unattend and
# roles/*_config). There is no global switch for this in ansible-core --
# a `no_log_on_error` key here would be silently ignored.

[inventory]
# A broken dynamic inventory must stop the run, not silently yield an
# empty host list.
unparsed_is_failed     = True
any_unparsed_is_failed = True
enable_plugins         = script, yaml, ini, constructed

[privilege_escalation]
become        = False
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
# `ansible-config validate` reports this as an "unknown section". That is
# a limitation of that subcommand -- it validates base config only and
# does not know about connection-plugin sections. The settings are
# genuinely applied; confirm with:
#   ansible-config dump --type all | grep -E "pipelining|ssh_args"
# ControlPersist makes the multi-play Ubuntu path noticeably faster.
ssh_args        = -C -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey -o ServerAliveInterval=15
pipelining      = True
control_path    = /tmp/.ansible-cp-%%h-%%p-%%r
scp_if_ssh      = smart
retries         = 3

[persistent_connection]
connect_timeout = 60
command_timeout = 60

[colors]
skip    = cyan
ok      = green
changed = yellow
error   = red
