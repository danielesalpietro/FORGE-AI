---
# =====================================================================
# semaphore_config -- project, repository, inventory, keys, templates
# =====================================================================
# Uses the Semaphore REST API. Where the API cannot express something,
# the role prints the manual step instead of pretending it happened.
#
# Authentication: Semaphore issues API tokens per user
# (POST /api/user/tokens). bootstrap/bootstrap.sh creates one and stores
# it in the vault and in compose/.env.
# =====================================================================

- name: Wait for the Semaphore API
  ansible.builtin.uri:
    url: "{{ semaphore_api_url }}/ping"
    method: GET
    status_code: [200]
  register: forge_semaphore_ping
  retries: "{{ (semaphore_wait_timeout | int / 10) | round | int }}"
  delay: 10
  until: forge_semaphore_ping is succeeded
  changed_when: false
  tags: [bootstrap, gitops]

- name: Require an API token
  ansible.builtin.assert:
    that:
      - vault_semaphore_api_token | default('') | length > 0
    fail_msg: |
      vault_semaphore_api_token is empty.

      Create one:
        curl -sS -X POST {{ semaphore_api_url }}/auth/login \
          -H 'Content-Type: application/json' \
          -d '{"auth":"<admin-user>","password":"<admin-password>"}' -c /tmp/sem.jar
        curl -sS -X POST {{ semaphore_api_url }}/user/tokens -b /tmp/sem.jar | jq -r .id

      Then store it:
        ansible-vault edit ansible/inventories/poc/group_vars/all/vault.yml

      bootstrap/bootstrap.sh does all of this automatically.
    success_msg: "Semaphore API token present ({{ vault_semaphore_api_token | redact }})"
  no_log: true
  tags: [bootstrap, gitops]

- name: List the existing projects
  ansible.builtin.uri:
    url: "{{ semaphore_api_url }}/projects"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_semaphore_api_token }}"
    status_code: [200]
  register: forge_semaphore_projects
  changed_when: false
  no_log: true
  tags: [bootstrap, gitops]

- name: Create the project
  ansible.builtin.uri:
    url: "{{ semaphore_api_url }}/projects"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_semaphore_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ gitops.semaphore_project_name }}"
      alert: false
      max_parallel_tasks: 1
    status_code: [201]
  register: forge_semaphore_project_created
  when: forge_semaphore_projects.json | selectattr('name', 'eq', gitops.semaphore_project_name) | list | length == 0
  no_log: true
  tags: [bootstrap, gitops]

- name: Resolve the project id
  ansible.builtin.set_fact:
    forge_semaphore_project_id: >-
      {{ forge_semaphore_project_created.json.id
         if forge_semaphore_project_created is changed
         else (forge_semaphore_projects.json | selectattr('name', 'eq', gitops.semaphore_project_name)
               | map(attribute='id') | first) }}
  tags: [bootstrap, gitops]

- name: Report the project id
  ansible.builtin.debug:
    msg: |
      Semaphore project '{{ gitops.semaphore_project_name }}' has id {{ forge_semaphore_project_id }}.

      Put it in compose/.env so the webhook receiver can start tasks:
        SEMAPHORE_PROJECT_ID={{ forge_semaphore_project_id }}
  tags: [bootstrap, gitops]

- name: Include the key store configuration
  ansible.builtin.include_tasks: keys.yml
  tags: [bootstrap, gitops, security]

- name: Include the repository and inventory configuration
  ansible.builtin.include_tasks: repository.yml
  tags: [bootstrap, gitops]

- name: Include the template configuration
  ansible.builtin.include_tasks: templates.yml
  when: semaphore_manage_templates | bool
  tags: [bootstrap, gitops]

- name: Summarise what was configured
  ansible.builtin.debug:
    msg: |
      ==========================================================
       Semaphore is configured
      ==========================================================
       URL        : {{ forge_semaphore_url }}
       Project    : {{ gitops.semaphore_project_name }} (id {{ forge_semaphore_project_id }})
       Repository : {{ semaphore_repo_url }} ({{ semaphore_repo_branch }})
       Inventory  : {{ semaphore_inventory_path }}
       Templates  : {{ semaphore_templates | length }}

       Deployment templates 01-10 run in order.
       Template 11 detects drift and changes nothing.
       Template 12 reconciles it, after review.
       Template 99 is destructive and is separated deliberately: it refuses
       to run unless confirm_destroy={{ safety.destroy_confirmation_token }} is
       passed as a survey variable.

       Still to do by hand (the API cannot express them):
         * add the drift-check schedule if you want it (Project -> Schedules)
         * review template 99's survey variable is marked required
      ==========================================================
  tags: [bootstrap, gitops]
