---
# =====================================================================
# FORGE-AI :: static inventory companion
# =====================================================================
# The real host list is produced by forge-inventory.py in this same
# directory, which reads config/poc.yml so that IP and MAC addresses
# exist in exactly one place. Ansible parses every source in an
# inventory *directory* and merges the results, so this file only has
# to declare what the dynamic source cannot know:
#
#   * group membership that is policy rather than configuration;
#   * the empty group skeletons, so `--limit windows` still resolves on
#     a host where config/poc.yml defines no Windows target.
#
# Do not add hosts here. Add them to config/poc.yml.
# =====================================================================

all:
  children:

    # Everything that runs on the KVM host itself: libvirt, dnsmasq,
    # the Docker control plane, media preparation.
    control_plane:
      hosts:
        forge-control:
          ansible_connection: local
          ansible_host: 127.0.0.1

    # Provisioned virtual machines. Populated by forge-inventory.py.
    forge_targets:
      children:
        linux:
          children:
            ubuntu_server: {}
        windows:
          children:
            windows_server: {}
