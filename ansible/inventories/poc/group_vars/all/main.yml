---
# =====================================================================
# FORGE-AI :: variables for every host
# =====================================================================
# The bulk of the configuration arrives from forge-inventory.py, which
# publishes config/defaults.yml merged with config/poc.yml as group
# variables on `all`. This file holds only the things that are a
# property of the *run*, not of the desired state.
# =====================================================================

# ---------------------------------------------------------------------
# Shared templates
# ---------------------------------------------------------------------
# Every playbook here lives in ansible/playbooks/, so `playbook_dir` is
# always that directory -- `dirname` walks up one level to `ansible/`,
# landing on the single templates/ tree every role's `template` tasks
# render from (only ubuntu_baseline keeps its own role-local copies).
# Roles cannot see this via a bare role-relative `src:` on their own;
# ansible-lint's no-relative-paths rule also forbids spelling it with a
# literal `..` in the task file, so it is resolved once, here, instead.
forge_shared_templates_dir: "{{ playbook_dir | dirname }}/templates"

# ---------------------------------------------------------------------
# Run identity -- stamped into every rendered artefact and report.
# ---------------------------------------------------------------------
# Overridden per run by site.yml, or from Semaphore via the task
# environment (-e forge_deployment_id=...).
forge_deployment_id: "{{ lookup('env', 'FORGE_DEPLOYMENT_ID') | default(ansible_date_time.iso8601_basic_short | default('manual'), true) }}"
forge_git_commit: "{{ lookup('env', 'FORGE_GIT_COMMIT') | default('unknown', true) }}"
forge_git_branch: "{{ lookup('env', 'FORGE_GIT_BRANCH') | default('unknown', true) }}"
forge_operator: "{{ lookup('env', 'FORGE_OPERATOR') | default(lookup('env', 'USER'), true) | default('unknown', true) }}"
forge_trigger: "{{ lookup('env', 'FORGE_TRIGGER') | default('cli', true) }}"

# ---------------------------------------------------------------------
# Safety interlocks
# ---------------------------------------------------------------------
# destroy-poc.yml refuses to run unless this is passed explicitly:
#   ansible-playbook playbooks/destroy-poc.yml -e confirm_destroy=DESTROY-POC
confirm_destroy: ""

# Set to true to let a playbook proceed past a warning that would
# normally stop it (a DHCP conflict, an unpinned checksum). Every use is
# logged loudly.
forge_force: false

# ---------------------------------------------------------------------
# Timeouts used by the wait-for-* logic
# ---------------------------------------------------------------------
forge_wait_install_timeout: 3600      # OS installation, seconds
forge_wait_ssh_timeout: 900
forge_wait_winrm_timeout: 1800
forge_wait_poll_interval: 15

# ---------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------
# Real values live in group_vars/all/vault.yml, which is committed
# encrypted at rest (docs/SECURITY.md, "Secrets: where each one lives"),
# or in the Semaphore Key Store. See vault.yml.example for the shape.
#
# There are deliberately NO empty defaults for the secrets here.
#
# There used to be three, justified by a comment promising that a
# missing vault would "produce a clear failure in
# validate-prerequisites.yml rather than an undefined-variable crash
# three playbooks later". That check does not exist: neither
# validate-prerequisites.yml nor the prerequisite_validation role ever
# looks at these variables, and the Semaphore route runs
# validate-deployment.yml, which does not include them either.
#
# So the defaults protected nothing. What they did was turn "the secret
# is missing" into "an empty password was offered to the target", which
# WinRM reports as "the specified credentials were rejected by the
# server" -- a message that sends you looking for a wrong password when
# the truth is that no password was configured at all. That cost a full
# session to diagnose (bug 45; see docs/logbook/07-project-review.md and
# 08-ripresa-test-e-verifica-deploy.md).
#
# Undefined is the better failure. It is immediate, it names the
# variable, and it cannot be mistaken for a credential problem. Note
# that no in-play assertion could replace it for the Windows path:
# vault_windows_admin_password is consumed by group_vars/windows/main.yml
# as ansible_password, so it is read when the connection is set up,
# before any task in the play can run.
ubuntu_bootstrap_password_hash: "{{ vault_ubuntu_bootstrap_password_hash }}"
forge_state_token: "{{ vault_forge_state_token }}"
